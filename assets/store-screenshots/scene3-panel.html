<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Marker - Compact Toolbar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
  overflow: hidden; height: 100vh;
  background:
    radial-gradient(ellipse 80% 60% at 30% 70%, rgba(20, 60, 120, 0.7) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 70% 40%, rgba(40, 80, 160, 0.5) 0%, transparent 60%),
    radial-gradient(ellipse 90% 80% at 50% 50%, rgba(10, 30, 80, 0.8) 0%, transparent 80%),
    linear-gradient(135deg, #0a0e1a 0%, #0d1528 30%, #111d3a 60%, #0a1020 100%);
}
body {
  width: 1920px;
  height: 1080px;
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  background: transparent;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Main row: equal-height left + right */
.main-row {
  position: relative;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 100px;
}

/* ===== One-line toolbar mockup (mirrors ToolToolbar.vue) ===== */
.demo-col {
  width: 850px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* Outer box reserves the SCALED footprint (543×157 layout × 1.5) so nothing overlaps. */
.toolbar-outer {
  width: 815px;
  height: 236px;
}
.toolbar-stack {
  width: 543px;
  transform: scale(1.5);
  transform-origin: top left;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
}
.tb-surface {
  background: #1e1e20;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.45), 0 4px 16px rgba(0,0,0,0.25);
}
.tb-bar {
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 8px 6px;
}
.tb-grip {
  width: 16px;
  height: 24px;
  margin-right: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.35);
  opacity: 0.65;
  flex-shrink: 0;
}
.tb-btn {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 9px;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.tb-btn svg {
  width: 15px;
  height: 15px;
  stroke: rgba(255,255,255,0.65);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tb-btn.active {
  background: #183d63;
  box-shadow: inset 0 0 0 1px rgba(10,132,255,0.4);
}
.tb-btn.active svg { stroke: #fff; }
.tb-btn.disabled { opacity: 0.32; }
.tb-caret {
  position: absolute;
  right: 2px;
  bottom: 1px;
  width: 9px;
  height: 9px;
  stroke: rgba(255,255,255,0.8);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.55;
}
.tb-div {
  width: 1px;
  height: 22px;
  background: rgba(255,255,255,0.05);
  margin: 0 6px;
  flex-shrink: 0;
}
.tb-width {
  width: 24px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 7px;
  background: rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tb-width.active {
  background: #183d63;
  box-shadow: inset 0 0 0 1px rgba(10,132,255,0.4);
}
.tb-width-line {
  width: 17px;
  border-radius: 99px;
  background: rgba(255,255,255,0.4);
}
.tb-width.active .tb-width-line { background: #fff; }
.tb-swatch-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #FF3B30;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
}

/* Settings flyout (opened above the bar) */
.tb-flyout {
  align-self: flex-start;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px;
  width: max-content;
}
.tb-colors-row {
  display: flex;
  align-items: center;
  gap: 2px;
}
.tb-swatch {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.tb-swatch > i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: block;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
}
.tb-swatch.active { transform: scale(1.18); }
.tb-swatch.active > i { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.3), inset 0 0 0 1px rgba(0,0,0,0.2); }
.tb-swatch.active::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  font-style: normal;
  text-shadow: 0 0 2px rgba(0,0,0,0.5);
}
.tb-swatch-custom {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: conic-gradient(from 90deg, #ff0000, #ff8000, #ffff00, #80ff00, #00ff00, #00ff80, #00ffff, #0080ff, #0000ff, #8000ff, #ff00ff, #ff0080, #ff0000);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
}
.tb-swatch-custom::after {
  content: '+';
  color: #fff;
  font-size: 12px;
  line-height: 1;
  font-weight: 300;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.tb-flyout-close {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  margin-left: auto;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tb-flyout-close svg {
  width: 12px;
  height: 12px;
  stroke: rgba(255,255,255,0.7);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
}
.tb-flyout-sep {
  border-top: 1px solid rgba(255,255,255,0.05);
}
.tb-copy-btn {
  height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.7);
}
.tb-copy-btn svg {
  width: 14px;
  height: 14px;
  stroke: rgba(255,255,255,0.7);
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.demo-hint {
  margin-top: 36px;
  font-size: 15px;
  color: rgba(255,255,255,0.35);
  display: flex;
  align-items: center;
  gap: 8px;
}
.demo-hint b {
  color: rgba(255,255,255,0.6);
  font-weight: 600;
}

/* Right side feature descriptions */
.features-side {
  max-width: 460px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.features-side .accent-line {
  width: 32px;
  height: 3px;
  background: #FF3B30;
  border-radius: 2px;
  margin-bottom: 18px;
}
.features-side h2 {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
  line-height: 1.35;
  margin-bottom: 12px;
}
.features-side .sub {
  font-size: 16px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 40px;
  line-height: 1.6;
}
.features-side .sub kbd {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: inherit;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}
.feature-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
}
.feature-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.feature-icon svg {
  width: 20px;
  height: 20px;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.feature-text h4 {
  font-size: 15px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  margin-bottom: 4px;
}
.feature-text p {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  line-height: 1.5;
}

/* Windows 11 Taskbar */
.taskbar {
  position: absolute;
  bottom: calc(-1 * var(--oy, 0px));
  left: calc(-1 * var(--ox, 0px));
  right: calc(-1 * var(--ox, 0px));
  height: 48px;
  background: rgba(32, 32, 32, 0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  z-index: 1;
}
.taskbar-icon {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  position: relative;
}
.taskbar-icon.active { background: rgba(255,255,255,0.08); }
.taskbar-icon.active::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 16px;
  height: 3px;
  border-radius: 2px;
  background: #60cdff;
}
.taskbar-time {
  position: absolute;
  right: 16px;
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  text-align: right;
  line-height: 1.4;
}

/* Marker branding */
.markeron-brand {
  position: absolute;
  bottom: calc(70px - var(--oy, 0px));
  right: calc(40px - var(--ox, 0px));
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.25);
  font-size: 13px;
  z-index: 100;
}
.markeron-brand svg { width: 16px; height: 16px; }
</style>
</head>

<script>
(function fitToScreen() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var ox = (window.innerWidth - 1920 * s) / 2;
  var oy = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transformOrigin = 'top left';
  document.body.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
  document.documentElement.style.setProperty('--ox', (ox / s) + 'px');
  document.documentElement.style.setProperty('--oy', (oy / s) + 'px');
  window.addEventListener('resize', fitToScreen);
})();
</script>
