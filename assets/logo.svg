<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>Editable vector logo</title>
  <desc>Vector redraw of the supplied icon, with editable paths and gradients.</desc>

  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="47%" r="73%">
      <stop offset="0" stop-color="#fcfcfb"/>
      <stop offset="0.72" stop-color="#f7f6f4"/>
      <stop offset="1" stop-color="#ecebe9"/>
    </radialGradient>

    <linearGradient id="ringGradient" x1="0.14" y1="0.16" x2="0.85" y2="0.87">
      <stop offset="0" stop-color="#ff2c20"/>
      <stop offset="0.52" stop-color="#ff3327"/>
      <stop offset="1" stop-color="#ff3b2c"/>
    </linearGradient>

    <linearGradient id="penGradient" x1="0.18" y1="0.92" x2="0.81" y2="0.08">
      <stop offset="0" stop-color="#092a67"/>
      <stop offset="0.52" stop-color="#0f377a"/>
      <stop offset="1" stop-color="#173f84"/>
    </linearGradient>
  </defs>

  <!-- Layer: background -->
  <g id="background">
    <rect width="1254" height="1254" fill="#ffffff"/>
    <rect x="1" y="1" width="1252" height="1252" rx="198" ry="198"
          fill="url(#backgroundGradient)"/>
  </g>

  <!-- Layer: open circular mark -->
  <g id="open-ring" fill="none" stroke="url(#ringGradient)"
     stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 753 389
             C 703 349, 641 328, 579 328
             C 395 328, 246 477, 246 661
             C 246 847, 397 997, 583 997
             C 777 997, 934 840, 934 646
             C 934 637, 934 630, 934 623"/>
  </g>

  <!-- Layer: pen nib; inner arrow is a genuine compound-path cutout -->
  <g id="pen-nib">
    <path fill="url(#penGradient)" fill-rule="evenodd" clip-rule="evenodd"
          d="M 952 279
             Q 966 264, 980 277
             L 1067 365
             Q 1080 378, 1068 391
             L 974 491
             Q 969 497, 960 500
             L 861 526
             Q 841 531, 838 512
             L 856 385
             Q 857 379, 862 374
             Z

             M 886 403
             L 917 403
             L 917 444
             L 958 444
             L 958 474
             L 934 479
             L 901 486
             L 878 460
             Z"/>
  </g>
</svg>
